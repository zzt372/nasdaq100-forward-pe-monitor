name: Diagnose Search Transports

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/query-diagnostics.yml"

permissions:
  contents: read

jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: ddg-html
            base: 'https://html.duckduckgo.com/html/?q='
          - engine: bing
            base: 'https://www.bing.com/search?q='
          - engine: google
            base: 'https://www.google.com/search?q='
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect raw result block
        env:
          ENGINE: ${{ matrix.engine }}
          BASE_URL: ${{ matrix.base }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from urllib.parse import quote_plus
          from urllib.request import Request, urlopen

          q = 'Trendonify "NASDAQ-100 Forward PE Ratio" percentile'
          url = os.environ["BASE_URL"] + quote_plus(q)
          req = Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          })
          with urlopen(req, timeout=25) as r:
              print("ENGINE=", os.environ["ENGINE"])
              print("STATUS=", r.status)
              raw = r.read(500000).decode("utf-8", "replace")

          needle = "trendonify.com/united-states/stock-market/nasdaq-100/forward-pe-ratio"
          low = html.unescape(raw).lower()
          pos = low.find(needle)
          print("RAW_FOUND=", pos >= 0)
          if pos >= 0:
              chunk = html.unescape(raw[max(0,pos-5000):pos+9000])
              text = re.sub(r"<script[\s\S]*?</script>", " ", chunk, flags=re.I)
              text = re.sub(r"<style[\s\S]*?</style>", " ", text, flags=re.I)
              text = re.sub(r"<[^>]+>", " ", text)
              text = " ".join(html.unescape(text).split())
              print("BLOCK_TEXT=", text[:8000])
          PY
