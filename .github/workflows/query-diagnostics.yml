name: Diagnose DuckDuckGo Parameters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/query-diagnostics.yml"

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            suffix: ''
          - name: us
            suffix: '&kl=us-en'
          - name: week
            suffix: '&df=w'
          - name: us-week
            suffix: '&kl=us-en&df=w'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe DuckDuckGo Lite
        env:
          PROBE_NAME: ${{ matrix.name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from urllib.parse import quote_plus
          from urllib.request import Request, urlopen

          q = 'Trendonify "NASDAQ-100 Forward PE Ratio" percentile'
          url = "https://lite.duckduckgo.com/lite/?q=" + quote_plus(q) + os.environ["SUFFIX"]
          req = Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          })
          print("PROBE=", os.environ["PROBE_NAME"])
          with urlopen(req, timeout=25) as r:
              print("STATUS=", r.status)
              raw = r.read(500000).decode("utf-8", "replace")
          text = re.sub(r"<script[\s\S]*?</script>", " ", raw, flags=re.I)
          text = re.sub(r"<style[\s\S]*?</style>", " ", text, flags=re.I)
          text = re.sub(r"<[^>]+>", " ", text)
          text = " ".join(html.unescape(text).split())
          print("NO_RESULTS=", "no results found for" in text.lower())
          needle = "trendonify.com/united-states/stock-market/nasdaq-100/forward-pe-ratio"
          pos = text.lower().find(needle)
          print("FOUND=", pos >= 0)
          if pos >= 0:
              print("CONTEXT=", text[max(0,pos-700):pos+4500])
          PY
