name: Probe Nasdaq source transports

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe DuckDuckGo Trendonify snippets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, html as htmlmod
          queries=[
            'Trendonify Nasdaq 100 forward P/E ratio as of',
            'site:trendonify.com/united-states/stock-market/nasdaq-100 "forward P/E ratio"',
            'Trendonify Nasdaq 100 Valuation Percentile Rank',
            'site:trendonify.com/united-states/stock-market/nasdaq-100 "Valuation Percentile Rank"',
            'Trendonify Nasdaq 100 forward P/E percentile',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'}
          for q in queries:
              print('\n===== QUERY',q,'=====')
              url='https://lite.duckduckgo.com/lite/?q='+urllib.parse.quote_plus(q)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read().decode('utf-8','replace')
              # Strip tags to expose result text. Keep URLs visible separately.
              text=re.sub(r'<script[\s\S]*?</script>',' ',data,flags=re.I)
              text=re.sub(r'<style[\s\S]*?</style>',' ',text,flags=re.I)
              text=re.sub(r'<[^>]+>',' ',text)
              text=htmlmod.unescape(text)
              text=' '.join(text.split())
              print('TEXT',text[:12000])
              print('NUMS',re.findall(r'(?<!\d)\d{1,3}(?:\.\d+)?%?(?!\d)',text)[:120])
              print('URL_MATCHES',re.findall(r'https?[^"<>\s]+trendonify[^"<>\s]+',data,re.I)[:20])
          PY
