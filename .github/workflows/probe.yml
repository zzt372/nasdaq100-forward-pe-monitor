name: Probe Nasdaq source transports

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        case: [dedicated, canonical-table, canonical-values, canonical-update, canonical-url]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe DuckDuckGo query ${{ matrix.case }} on isolated runner
        env:
          CASE: ${{ matrix.case }}
        shell: bash
        run: |
          python - <<'PY'
          import html as htmlmod
          import os
          import re
          import urllib.parse
          import urllib.request

          case = os.environ['CASE']
          queries = {
              'dedicated': 'Trendonify "Nasdaq 100 Forward PE Ratio" "percentile"',
              'canonical-table': 'Trendonify "Forward PE Ratio" "Nasdaq 100" "Percentile Rank (10Y)"',
              'canonical-values': 'Trendonify "Nasdaq 100" "20.78" "24.2%" "Sep 8, 2026"',
              'canonical-update': 'Trendonify "Nasdaq 100" "Forward P/E Ratio" "Last Update"',
              'canonical-url': '"trendonify.com/forward-pe-ratio" "Nasdaq 100" "24.2%"',
          }
          query = queries[case]
          url = 'https://lite.duckduckgo.com/lite/?q=' + urllib.parse.quote_plus(query)
          req = urllib.request.Request(
              url,
              headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Cache-Control': 'no-cache',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read().decode('utf-8', 'replace')
                  print('status=', r.status, 'bytes=', len(raw))
          except Exception as exc:
              print('FETCH_ERROR', type(exc).__name__, exc)
              raise SystemExit(2)

          text = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
          text = re.sub(r'<style[\s\S]*?</style>', ' ', text, flags=re.I)
          text = re.sub(r'<[^>]+>', ' ', text)
          text = ' '.join(htmlmod.unescape(text).split())
          low = text.lower()
          if 'select all squares containing a duck' in low or 'bots use duckduckgo too' in low:
              print('BOT_CHALLENGE')
              raise SystemExit(3)

          print('QUERY', query)
          print('TEXT', text[:14000])

          canonical_pos = text.find('Forward PE Ratio - trendonify.com')
          dedicated_pos = text.find('Nasdaq 100 Forward PE Ratio - trendonify.com')
          print('POSITIONS', canonical_pos, dedicated_pos)

          # Probe succeeds if any Trendonify result is returned; logs are inspected to
          # determine whether a stable canonical row can be parsed.
          if 'trendonify.com' not in low:
              raise SystemExit(4)
          PY
