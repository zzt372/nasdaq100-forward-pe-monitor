name: Probe Nasdaq source transports

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe alternate search indexes
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re
          q='Trendonify Forward PE Ratio Nasdaq 100'
          enc=urllib.parse.quote_plus(q)
          urls={
            'yahoo':'https://search.yahoo.com/search?p='+enc,
            'duckduckgo-lite':'https://lite.duckduckgo.com/lite/?q='+enc,
            'brave':'https://search.brave.com/search?q='+enc+'&source=web',
            'mojeek':'https://www.mojeek.com/search?q='+enc,
            'ecosia':'https://www.ecosia.org/search?q='+enc,
            'startpage':'https://www.startpage.com/sp/search?query='+enc,
          }
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'en-US,en;q=0.9'}
          for name,url in urls.items():
              print('\n===== '+name+' =====')
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read().decode('utf-8','replace')
                  low=data.lower()
                  nums=re.findall(r'(?<!\d)(?:1\d|2\d|3\d)\.\d{1,3}(?!\d)',data)
                  dates=re.findall(r'(?:Sep(?:tember)?\s+\d{1,2},?\s+2026)',data,re.I)
                  print('status',r.status,'len',len(data),'trendonify',low.count('trendonify'),'24.2',data.count('24.2'),'20.78',data.count('20.78'),'20.77',data.count('20.77'),'nums',nums[:30],'dates',dates[:10])
                  positions=[]
                  for needle in ('trendonify','24.2','20.78','20.77'):
                      p=low.find(needle.lower())
                      if p>=0: positions.append((p,needle))
                  for p,needle in sorted(positions)[:6]:
                      txt=re.sub(r'<[^>]+>',' ',data[max(0,p-800):p+2400])
                      txt=' '.join(txt.split())
                      print('AROUND',needle,txt[:2500])
              except Exception as e:
                  print(type(e).__name__,e)
          PY
