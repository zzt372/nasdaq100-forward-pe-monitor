name: Probe Nasdaq source transports

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Bing result blocks
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re
          from html.parser import HTMLParser

          q='Trendonify Forward PE Ratio Nasdaq 100'
          url='https://www.bing.com/search?count=20&q=' + urllib.parse.quote_plus(q)
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data=r.read().decode('utf-8','replace')
          print('len',len(data),'24.2',data.count('24.2'),'20.78',data.count('20.78'),'20.77',data.count('20.77'),'20.75',data.count('20.75'))
          for needle in ('24.2','20.78','20.77','20.75','Sep 8, 2026','September 8, 2026'):
              print('\n===== around',needle,'=====')
              start=0
              n=0
              while True:
                  p=data.find(needle,start)
                  if p<0: break
                  print(data[max(0,p-1600):p+2600].replace('::','--'))
                  start=p+len(needle)
                  n+=1
                  if n>=4: break

          # Roughly isolate Bing algorithmic result list items.
          for m in re.finditer(r'<li class="b_algo"[\s\S]*?</li>', data, re.I):
              block=m.group(0)
              txt=re.sub(r'<[^>]+>',' ',block)
              txt=re.sub(r'&[^;]+;',' ',txt)
              txt=' '.join(txt.split())
              low=txt.lower()
              if 'trendonify' in low or '24.2' in txt or 'forward pe' in low:
                  print('\n===== B_ALGO =====')
                  print(txt[:5000])
                  hrefs=re.findall(r'href="([^"]+)"',block)
                  print('hrefs',hrefs[:5])
          PY
