name: Probe Nasdaq recovery integration

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest -v test_fetch.py

      - name: Confirm committed state can be classified stale
        shell: bash
        run: |
          if python fetch.py --check-latest --max-fetch-age-seconds 1; then
            echo "expected committed state to be stale for this integration test"
            exit 1
          fi
          echo "stale path detected as expected"

      - name: Exercise recovery fetch on fresh runner
        run: python fetch.py

      - name: Validate recovered state
        run: python fetch.py --check-latest --max-fetch-age-seconds 120

      - name: Prove acquisition failure preserves last-known-good
        shell: bash
        run: |
          python - <<'PY'
          from unittest.mock import patch
          import fetch

          before = fetch.LATEST.read_bytes()
          challenge = "Unfortunately, bots use DuckDuckGo too. Select all squares containing a duck."
          try:
              with patch.object(fetch, "fetch_once", return_value=challenge):
                  fetch.run_fetch()
          except RuntimeError:
              pass
          else:
              raise SystemExit("expected simulated acquisition failure")

          after = fetch.LATEST.read_bytes()
          if before != after:
              raise SystemExit("latest.json changed after simulated failure")
          print("last-known-good preservation verified")
          PY
