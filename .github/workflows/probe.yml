name: Probe Nasdaq source transports

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        provider: [duckduckgo-lite, yahoo, bing, startpage]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe ${{ matrix.provider }} on isolated runner
        env:
          PROVIDER: ${{ matrix.provider }}
        shell: bash
        run: |
          python - <<'PY'
          import html as htmlmod
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          provider = os.environ['PROVIDER']
          query = 'Trendonify "Nasdaq 100 Forward PE Ratio" "percentile"'
          q = urllib.parse.quote_plus(query)
          urls = {
              'duckduckgo-lite': 'https://lite.duckduckgo.com/lite/?q=' + q,
              'yahoo': 'https://search.yahoo.com/search?p=' + q,
              'bing': 'https://www.bing.com/search?count=10&q=' + q,
              'startpage': 'https://www.startpage.com/sp/search?query=' + q,
          }
          req = urllib.request.Request(
              urls[provider],
              headers={
                  'User-Agent': 'Mozilla/5.0',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Cache-Control': 'no-cache',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read().decode('utf-8', 'replace')
                  print('status=', r.status, 'bytes=', len(raw))
          except Exception as exc:
              print('FETCH_ERROR', type(exc).__name__, exc)
              raise SystemExit(2)

          text = re.sub(r'<script[\s\S]*?</script>', ' ', raw, flags=re.I)
          text = re.sub(r'<style[\s\S]*?</style>', ' ', text, flags=re.I)
          text = re.sub(r'<[^>]+>', ' ', text)
          text = ' '.join(htmlmod.unescape(text).split())
          low = text.lower()

          if 'select all squares containing a duck' in low or 'bots use duckduckgo too' in low:
              print('BOT_CHALLENGE')
              raise SystemExit(3)

          marker = 'Nasdaq 100 Forward PE Ratio - trendonify.com'
          pos = text.find(marker)
          if pos < 0:
              print('DEDICATED_RESULT_MISSING')
              print(text[:5000])
              raise SystemExit(4)

          block = text[pos:pos+3500]
          valuation = re.search(
              r'current\s+P/E\s+Ratio\s+of\s+(\d+(?:\.\d+)?)\s+ranks\s+in\s+the\s+'
              r'(\d+(?:\.\d+)?)(?:st|nd|rd|th)?\s+percentile',
              block, re.I,
          )
          date_match = re.search(
              r'trendonify\.com/united-states/stock-market/nasdaq-100/forward-pe-ratio\s+'
              r'(20\d{2}-\d{2}-\d{2})T',
              block, re.I,
          )
          print('BLOCK', block[:3500])
          if not valuation or not date_match:
              print('FIELDS_MISSING', bool(valuation), bool(date_match))
              raise SystemExit(5)

          print('PARSED', valuation.group(1), valuation.group(2), date_match.group(1))
          PY
