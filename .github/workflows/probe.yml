name: Probe Nasdaq source transports

on:
  push:
    paths:
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe percentile snippet only
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, html as htmlmod
          q='Trendonify "Nasdaq 100 Forward PE Ratio" "percentile"'
          url='https://lite.duckduckgo.com/lite/?q='+urllib.parse.quote_plus(q)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=r.read().decode('utf-8','replace')
          text=re.sub(r'<script[\s\S]*?</script>',' ',data,flags=re.I)
          text=re.sub(r'<style[\s\S]*?</style>',' ',text,flags=re.I)
          text=re.sub(r'<[^>]+>',' ',text)
          text=htmlmod.unescape(text)
          text=' '.join(text.split())
          print(text[:16000])
          print('NUMS',re.findall(r'(?<!\d)\d{1,3}(?:\.\d+)?%?(?!\d)',text)[:200])
          PY
